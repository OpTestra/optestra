name: ci

on:
  # Local-first (2026-09-27): builds are checked locally; CI runs only when
  # started by hand at a milestone (Windows, Linux and what this Mac can't do).
  #   gh workflow run ci.yml --ref <branch>   (from a checkout of the engine repo)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Bench fixtures and the browser harness in real browsers. Kept out of `check` so it
  # stays fast and browser-free.
  fixtures:
    name: bench fixtures (ubuntu)
    runs-on: ubuntu-latest
    # A real test inbox for the auth e2e (SEC-5): the shop sends its sign-up code here.
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter ./bench/fixtures/shop exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium, Firefox and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter ./bench/fixtures/shop exec playwright install --with-deps chromium firefox webkit
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter ./bench/fixtures/shop exec playwright install-deps chromium firefox webkit
      - run: pnpm bench:fixtures:test
        env:
          MAILPIT_URL: http://127.0.0.1:8025
          MAILPIT_SMTP: 127.0.0.1:1025
          # A missing Mailpit fails the auth e2e here instead of skipping it.
          REQUIRE_MAILPIT: "1"
      # LOOP-4: `run` on every shop variant from the committed recordings, scored
      # against the manifest, plus replay vs generated-spec equivalence. The email
      # tests read their codes from the Mailpit service (AUTH-1).
      - run: pnpm bench:replay
        env:
          MAILPIT_URL: http://127.0.0.1:8025
          MAILPIT_SMTP: 127.0.0.1:1025
          REQUIRE_MAILPIT: "1"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-fixture-reports
          path: |
            bench/fixtures/*/playwright-report
            bench/fixtures/*/test-results

  # The Android harness on a real emulator (MOB-0), against the Acme Shop Android
  # fixture. Linux runners have KVM; the SDK packages are cached, the APKs are
  # built here (never committed).
  android:
    name: android emulator (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_PACKAGES: platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Cache Android SDK packages
        id: sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/system-images/android-36/google_apis/x86_64
          key: android-sdk-${{ runner.os }}-36-google_apis-x86_64-v1
      - name: Install Android SDK packages
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          IFS=' ' read -r -a packages <<< "$ANDROID_PACKAGES"
          "$SDKMANAGER" "${packages[@]}" > /dev/null
      - name: Check hardware acceleration
        # The x86_64 emulator needs KVM; print what the runner really has.
        run: |
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nproc
          free -m
      - run: pnpm install --frozen-lockfile
      - name: Build the driver and the fixture APKs
        run: |
          pnpm --filter @testament/android build:driver
          pnpm --filter @testament/fixture-android build:apks
      - run: pnpm --filter @testament/android test:android
