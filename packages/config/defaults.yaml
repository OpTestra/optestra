# Built-in defaults: the ONE place for default values (config over code).
# Resolution order, lowest to highest:
#   these defaults -> project file -> selected environment's overrides
#   -> environment variables -> run options from the caller (CLI flags / app).
# Objects merge key by key; arrays and plain values replace.
# A "*" entry inside a map applies to every entry of that map.
# Later phases add their sections' defaults here (e.g. models in FND-2).

environments:
  "*":
    production: false
    vars: {}

secrets: {}

run:
  # Maximum time for one test, in seconds.
  timeoutSeconds: 300
  # Extra attempts after a failure before the test is reported as failed.
  retries: 1
  # strict: never heal | review: propose fixes for approval | auto: apply and flag
  healPolicy: review
  # replay-only: never call AI | normal: AI only when a step breaks | rerecord: record again
  mode: normal
  budget:
    # Caps in US dollars (enforced from the models phase on).
    maxPerRunUsd: 1
    maxPerSuiteUsd: 10

# Test files. The spec package registers this section.
tests:
  # Folder with the tests, relative to the project folder.
  dir: tests
  # Globs (relative to dir) of the files that are tests or flows.
  include: ["**/*.test.md"]

# Test lint rules. The spec package registers this section.
lint:
  # Per-rule level (off | info | warning | error); unlisted rules use their default.
  rules: {}
  # Warnings count as errors for the exit code (CI).
  strict: false

# AI models (MOD-7): the ONLY place default model ids live. The models package
# registers this section. A pool entry is used only when its provider's key is
# available, so these pools switch on by themselves when the standard key env
# var is set (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY).
models:
  providers:
    anthropic:
      kind: anthropic
      keySecret: ANTHROPIC_API_KEY
    openai:
      kind: openai
      keySecret: OPENAI_API_KEY
    google:
      kind: google
      keySecret: GEMINI_API_KEY
  # Ordered pool per role: the first healthy entry answers (MOD-8).
  roles:
    # Writes and re-records tests: Sonnet-class models.
    planner:
      - { provider: anthropic, model: claude-sonnet-5 }
      - { provider: openai, model: gpt-6-sol }
      - { provider: google, model: gemini-3.8-flash }
    # Cheap, fast single-step heals.
    fixer:
      - { provider: anthropic, model: claude-haiku-4-5 }
      - { provider: openai, model: gpt-6-luna }
      - { provider: google, model: gemini-3.5-flash-lite }
  # Per-model price overrides (USD per million tokens); the base table ships with the models package.
  prices: {}
  # Maximum time for one model request, in seconds.
  timeoutSeconds: 120

# The decision layer (LRN-6..8). The decide package registers this section.
decisions:
  # Decision model behind the rules (LRN-7):
  #   auto = Jev when JEV_API_KEY is set, otherwise rules only (no network)
  #   none = rules only; unclear cases escalate
  #   jev | kev | laya = that model (Kev and Laya are only used when chosen)
  backend: auto
  # Per phase (DEC-2). auto = whatever `backend` names; when that is auto too:
  #   during (fast, ~100 ms limit): rules only; laya only when chosen explicitly
  #   after (batched, ~2 s limit): Jev when JEV_API_KEY is set, otherwise rules only
  during: auto
  after: auto
  # Stop calling a backend for a task after this many timeouts in one run.
  skipAfterTimeouts: 3
  # Jev, hosted by TypeSafe AI. Billed per input token.
  jev:
    baseUrl: https://api.typesafe.ai
    model: jev-latest
    keySecret: JEV_API_KEY
    priceUsdPerMillionInputTokens: 0.042
    # Measured p50 ≈ 380 ms: too slow for 100 ms during-run decisions.
    expectedLatencyMs: 400
  # Kev, open models you run yourself (python -m kev.serve ... --port 8009).
  kev:
    baseUrl: http://127.0.0.1:8009
    model: kev-latest
    # keySecret: KEV_API_KEY   # if your Kev server requires a key
    priceUsdPerMillionInputTokens: 0
    # Kev-4B on an Apple M5: ~140–720 ms per request.
    expectedLatencyMs: 500
  # Laya, run locally through Ollaya (ollaya.dev). Recommended after training.
  laya:
    baseUrl: http://127.0.0.1:11435
    model: "laya:typed-decisions"
    # keySecret: OLLAYA_API_KEY   # if your Ollaya requires a key
    priceUsdPerMillionInputTokens: 0
    # Measured p50 ≈ 84 ms warm for one question.
    expectedLatencyMs: 90
    # Keep the model loaded between decisions.
    keepAlive: 30m
    # The first decision loads the model (about 2 s); the run warms it up first.
    warmUpTimeoutMs: 15000
  # Minimum confidence to act on a decision; below it the decision escalates.
  threshold: 0.8
  # Per-task overrides, e.g. page_is_error: { threshold: 0.9, timeLimitMs: 150, enabled: true }
  tasks: {}
  cache:
    # Reuse decision model answers for the same input (rules answers are never cached).
    enabled: true
    # One week.
    ttlSeconds: 604800
