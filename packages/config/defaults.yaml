# Built-in defaults: the ONE place for default values (config over code).
# Resolution order, lowest to highest:
#   these defaults -> project file -> selected environment's overrides
#   -> environment variables -> run options from the caller (CLI flags / app).
# Objects merge key by key; arrays and plain values replace.
# A "*" entry inside a map applies to every entry of that map.
# Later phases add their sections' defaults here (e.g. models in FND-2).

environments:
  "*":
    production: false
    vars: {}

secrets: {}

run:
  # Maximum time for one test, in seconds.
  timeoutSeconds: 300
  # Extra attempts after a failure before the test is reported as failed.
  retries: 1
  # strict: never heal | review: propose fixes for approval | auto: apply and flag
  healPolicy: review
  # replay-only: never call AI | normal: AI only when a step breaks | rerecord: record again
  mode: normal
  # Evidence per test (EVD-1). full: trace, network log and a screenshot per step
  # for every test | failures: the same is recorded, but a clean pass keeps only
  # its screenshots, video and console | minimal: no trace or network log,
  # screenshots only where a step failed. Default: full in CI, failures elsewhere.
  # evidence: failures
  budget:
    # Caps in US dollars (enforced from the models phase on).
    maxPerRunUsd: 1
    maxPerSuiteUsd: 10

# Test files. The spec package registers this section.
tests:
  # Folder with the tests, relative to the project folder.
  dir: tests
  # Globs (relative to dir) of the files that are tests or flows.
  include: ["**/*.test.md"]

# Test lint rules. The spec package registers this section.
lint:
  # Per-rule level (off | info | warning | error); unlisted rules use their default.
  rules: {}
  # Warnings count as errors for the exit code (CI).
  strict: false

# Branch-aware recordings (REP-8): on a feature branch, recordings the engine writes go to
# <tests>/<data dir>/branches/<branch>/ and runs prefer them; `recordings promote` moves them
# into place after the merge. branches: auto (GitHub projects), on, off. mainBranch (not set:
# main or master) names the branch whose recordings are the main ones. The spec package
# registers this section.
recordings:
  branches: auto

# Accessibility warnings (EVD-6): off, or warn (axe-core, WCAG 2 A/AA, on every page a run visits;
# shown apart, never a failure). The spec package registers this section.
accessibility: off

# Muted tests (DIA-5): { test, reason, until }. The spec package registers this section.
quarantine: []

# Setup and teardown hooks (AUT-10). The spec package registers this section.
hooks:
  run:
    # Commands run: hooks may start: a program on the PATH or a project path glob.
    allow: []
    # Seconds before a run: hook is stopped.
    timeoutSeconds: 60
  sql:
    # connection: TEST_DATABASE_URL  (the declared secret with the database URL; unset: sql: hooks can't run)
    # The client that runs statements: psql (Postgres) or mysql.
    client: psql
    timeoutSeconds: 30

# Android runs (MOB-1, TGT-4). The android package registers this section.
android:
  # Android version, from the android package's versions.json (13 to 17).
  version: "16"
  # Device profile, from its devices.json (small-phone, pixel-8, pixel-tablet…).
  device: pixel-8

# AI models (MOD-7): the ONLY place default model ids live. The models package
# registers this section. A pool entry is used only when its provider's key is
# available, so these pools switch on by themselves when the standard key env
# var is set (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY).
models:
  providers:
    anthropic:
      kind: anthropic
      keySecret: ANTHROPIC_API_KEY
    openai:
      kind: openai
      keySecret: OPENAI_API_KEY
    google:
      kind: google
      keySecret: GEMINI_API_KEY
    # Named providers (PROV-0): their base URL, key name (OPENROUTER_API_KEY,
    # OLLAMA_API_KEY) and concurrency (8 and 3) are built in. OpenRouter pins each
    # model to its author's own endpoint, with no fallbacks and no data collection.
    openrouter:
      kind: openrouter
    ollama-cloud:
      kind: ollama-cloud
    # Your own AI subscription through the vendor's official CLI (MOD-6). Used only
    # when the CLI is installed and signed in, after the API-key entries.
    claude-code:
      kind: claude-code
    codex:
      kind: codex
  # Ordered pool per role: the first healthy entry answers (MOD-8).
  roles:
    # Writes and re-records tests. First: DeepSeek-V4.1-Flash on Ollama Cloud (with an
    # OLLAMA_API_KEY). EVAL-1 (bench/results/2026-10-02-open-models.json): 11/11
    # authored, 0/15 wrong passes, 0/62 wrong fails, like Sonnet 5.5, at about a
    # fifteenth of the cost; on Android 7/7, 0/10, 0/25 (2026-10-02-android-open-models.json).
    # The Claude default stays pinned to Sonnet 5.5 for both
    # roles (EVAL-0, bench/results/2026-10-01-model-comparison.json). Change only
    # after a new model comparison (`bench --compare`) passes the rule in docs/ai/models.md.
    planner:
      - { provider: ollama-cloud, model: deepseek-v4.1-flash }
      - { provider: anthropic, model: claude-sonnet-5-5 }
      - { provider: openai, model: gpt-6-sol }
      - { provider: google, model: gemini-3.8-flash }
      - { provider: openrouter, model: anthropic/claude-sonnet-5.5 }
      - { provider: claude-code, model: claude-sonnet-5-5 }
      - { provider: codex, model: default }
    # Single-step heals: DeepSeek-V4.1-Flash ~$0.0004 each (EVAL-1), Sonnet 5.5 ~$0.006 (EVAL-0).
    fixer:
      - { provider: ollama-cloud, model: deepseek-v4.1-flash }
      - { provider: anthropic, model: claude-sonnet-5-5 }
      - { provider: openai, model: gpt-6-luna }
      - { provider: google, model: gemini-3.5-flash-lite }
      - { provider: openrouter, model: anthropic/claude-sonnet-5.5 }
      - { provider: claude-code, model: claude-sonnet-5-5 }
      - { provider: codex, model: default }
  # Per-model price overrides (USD per million tokens); the base table ships with the models package.
  prices: {}
  # Maximum time for one model request, in seconds.
  timeoutSeconds: 120
  # Longest one call waits out a provider's rate limit (429, Retry-After) before the
  # next provider is tried. Waits never count against a test's time limit.
  maxWaitMinutes: 30
  # Allow claude-code / codex (the user's own subscription). the cloud sets false.
  allowDelegated: true
  # Most calls one run may make through each subscription CLI.
  delegatedCallsPerRun: 60

# The decision layer (LRN-6..8). The decide package registers this section.
decisions:
  # Decision model behind the rules (LRN-7):
  #   auto = Jev when JEV_API_KEY is set, otherwise rules only (no network)
  #   none = rules only; unclear cases escalate
  #   jev | kev | laya = that model (Kev and Laya are only used when chosen)
  backend: auto
  # Per phase (DEC-2). auto = whatever `backend` names; when that is auto too:
  #   during (fast, ~100 ms limit): rules only; laya only when chosen explicitly
  #   after (batched, ~2 s limit): Jev when JEV_API_KEY is set, otherwise rules only
  during: auto
  after: auto
  # Stop calling a backend for a task after this many timeouts in one run.
  skipAfterTimeouts: 3
  # Jev, hosted by TypeSafe AI. Billed per input token.
  jev:
    baseUrl: https://api.typesafe.ai
    model: jev-latest
    keySecret: JEV_API_KEY
    priceUsdPerMillionInputTokens: 0.042
    # Measured p50 ≈ 380 ms: too slow for 100 ms during-run decisions.
    expectedLatencyMs: 400
  # Kev, open models you run yourself (python -m kev.serve ... --port 8009).
  kev:
    baseUrl: http://127.0.0.1:8009
    model: kev-latest
    # keySecret: KEV_API_KEY   # if your Kev server requires a key
    priceUsdPerMillionInputTokens: 0
    # Kev-4B on an Apple M5: ~140–720 ms per request.
    expectedLatencyMs: 500
  # Laya, run locally through Ollaya (ollaya.dev). Recommended after training.
  laya:
    baseUrl: http://127.0.0.1:11435
    model: "laya:typed-decisions"
    # keySecret: OLLAYA_API_KEY   # if your Ollaya requires a key
    priceUsdPerMillionInputTokens: 0
    # Measured p50 ≈ 84 ms warm for one question.
    expectedLatencyMs: 90
    # Keep the model loaded between decisions.
    keepAlive: 30m
    # The first decision loads the model (about 2 s); the run warms it up first.
    warmUpTimeoutMs: 15000
  # Minimum confidence to act on a decision; below it the decision escalates.
  threshold: 0.8
  # Per-task overrides, e.g. page_is_error: { threshold: 0.9, timeLimitMs: 150, enabled: true }
  tasks: {}
  cache:
    # Reuse decision model answers for the same input (rules answers are never cached).
    enabled: true
    # One week.
    ttlSeconds: 604800

# Login profiles and TOTP (SEC-3, SEC-4). The auth package registers this section.
auth:
  # Named logins a test picks with `auth: <name>` (`auth: none` = start logged out), e.g.
  #   admin:
  #     flow: flows/login-admin.test.md   # the flow that logs in (relative to tests.dir)
  #     params: { email: "{{data.admin_email}}" }
  #     check: { url: /dashboard }         # how to tell a saved session still works
  profiles:
    "*":
      params: {}
      # per-worker: each parallel worker logs in once (tests that change server data)
      # shared: one saved session for every worker
      reuse: per-worker
      # A saved session is used for at most this long, then the flow logs in again.
      ttlMinutes: 60
  totp:
    # If the current code expires in fewer seconds than this, wait for the next one.
    minRemainingSeconds: 5

# Test email inboxes (SEC-5). The auth package registers this section.
inbox:
  # none | mailpit | mailosaur | mailslurp
  provider: none
  # How long a test waits for an email, in seconds.
  timeoutSeconds: 60
  # Mailpit on your machine or in CI (mailpit.axllent.org). Catches every address.
  mailpit:
    url: http://127.0.0.1:8025
    # Domain for generated addresses like {{unique.email}}.
    domain: example.test
  # Mailosaur (hosted). Addresses are <anything>@<serverId>.mailosaur.net.
  mailosaur:
    baseUrl: https://mailosaur.com
    # serverId: abc123
    keySecret: MAILOSAUR_API_KEY
  # MailSlurp (hosted). Each address is an inbox created through its API.
  mailslurp:
    baseUrl: https://api.mailslurp.com
    # inboxId: <an existing inbox to reuse>
    keySecret: MAILSLURP_API_KEY
