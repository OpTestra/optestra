# Model prices: the ONE price table. USD per 1 million tokens.
#   input       = uncached input tokens
#   cachedInput = cache reads (defaults to input when absent)
#   cacheWrite  = cache writes (defaults to input when absent)
#   output      = output tokens
# Projects override entries with `models.prices`. Models not listed here get
# cost null and a warning: never a guess. Provider-reported cost (e.g. OpenRouter)
# always wins over this table.
# Checked 2026-10-01 against the providers' official pricing pages.

# Anthropic: platform.claude.com/docs/en/about-claude/pricing (cacheWrite = 5-minute cache)
claude-sonnet-4-6: { input: 3, cachedInput: 0.3, cacheWrite: 3.75, output: 15 }
claude-sonnet-5-5: { input: 2, cachedInput: 0.2, cacheWrite: 2.5, output: 10 }
claude-sonnet-5: { input: 2, cachedInput: 0.2, cacheWrite: 2.5, output: 10 }
claude-haiku-4-5: { input: 1, cachedInput: 0.1, cacheWrite: 1.25, output: 5 }
claude-haiku-4-5-20251001: { input: 1, cachedInput: 0.1, cacheWrite: 1.25, output: 5 }

# OpenAI: developers.openai.com/api/docs/pricing
gpt-6-astra: { input: 10, cachedInput: 1, output: 50 }
gpt-6-sol: { input: 2, cachedInput: 0.2, output: 10 }
# gpt-6-luna: prompts over 272K tokens cost 0.2 / 0.02 / 0.25 / 0.75 (not modelled: our prompts stay far below).
gpt-6-luna: { input: 0.1, cachedInput: 0.01, cacheWrite: 0.125, output: 0.5 }

# Google: ai.google.dev/gemini-api/docs/pricing (prompts up to 200k tokens)
# gemini-3.8-flash: promotional price until 2026-12-31, then 1.5 / 0.15 / 7.5.
gemini-3.8-flash: { input: 0.75, cachedInput: 0.075, output: 3.75 }
gemini-3.5-flash-lite: { input: 0.3, output: 2.5 }
gemini-3.1-pro-preview: { input: 2, cachedInput: 0.2, output: 12 }

# OpenRouter, keyed `openrouter:<model>`: the pinned upstream's price (the default
# pin is the model's author, see AUTHOR_ENDPOINTS). OpenRouter charges no markup
# on inference; it reports the real charge on every call (usage.cost), which wins.
# Checked 2026-10-02 against openrouter.ai/api/v1/models/<model>/endpoints.
# (Its fee on buying credit is a separate line in the cost facts.)
"openrouter:anthropic/claude-sonnet-5.5": { input: 2, cachedInput: 0.2, cacheWrite: 2.5, output: 10 }
"openrouter:moonshotai/kimi-k3": { input: 3, cachedInput: 0.3, output: 15 }
"openrouter:z-ai/glm-5.3": { input: 1.4, cachedInput: 0.26, output: 4.4 }
"openrouter:deepseek/deepseek-v4.1-flash": { input: 0.15, cachedInput: 0.003, output: 0.6 }
"openrouter:minimax/minimax-m3": { input: 0.3, cachedInput: 0.06, output: 1.2 }
"openrouter:qwen/qwen3.8-max-0902": { input: 2, cachedInput: 0.25, cacheWrite: 2.5, output: 6 }

# Ollama Cloud credits, keyed `ollama-cloud:<model>`: ollama.com/pricing, checked
# 2026-10-02 (peak rate; Ollama bills less off-peak, outside 12:00-18:00 UTC on
# weekdays and all weekend, so these are an upper bound). Ollama reports no cost.
"ollama-cloud:deepseek-v4.1-flash": { input: 0.3, cachedInput: 0.006, output: 1.2 }
"ollama-cloud:deepseek-v4-pro": { input: 1.32, cachedInput: 0.044, output: 3.96 }
"ollama-cloud:gemma4": { input: 0.14, cachedInput: 0.05, output: 0.4 }
"ollama-cloud:glm-5.3": { input: 1.4, cachedInput: 0.26, output: 4.4 }
"ollama-cloud:kimi-k3": { input: 3, cachedInput: 0.3, output: 15 }
"ollama-cloud:mistral-large-3": { input: 0.5, output: 1.5 }
"ollama-cloud:nemotron-3-nano": { input: 0.06, output: 0.24 }
