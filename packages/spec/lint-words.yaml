# missing-start: a first step starting with one of these navigates.
navigationVerbs:
  - go to
  - open
  - navigate to
  - visit
  - browse to
  - launch
  - start the app
  - open the app
  - load

# destructive-undeclared (SAF-4): phrases that mean each destructive action.
destructive:
  delete: [delete, remove, erase, destroy, close account, close my account, deactivate]
  pay: [pay, purchase, buy, place order, place the order, complete order, complete the order, complete purchase]
  send: [send, resend, send email, send message]
  invite: [invite]
  cancel:
    - cancel subscription
    - cancel the subscription
    - cancel my subscription
    - cancel plan
    - cancel the plan
    - cancel order
    - cancel the order
    - cancel membership
    - cancel booking
    - cancel account
    - unsubscribe

# literal-credential: field words that take a credential, and the shortest
# literal treated as a real one (shorter values are usually invalid-input tests).
credentialFields:
  password: PASSWORD
  passcode: PASSCODE
  passphrase: PASSPHRASE
  pin: PIN
  token: TOKEN
  api key: API_KEY
  apikey: API_KEY
  access key: ACCESS_KEY
  secret: SECRET
credentialMinLength: 8
# Values that look like keys or tokens wherever they appear.
tokenPatterns:
  - '\b(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{10,}\b'
  - '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
  - '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}\b'
  - '\bAKIA[0-9A-Z]{16}\b'
  - '\bxox[abprs]-[A-Za-z0-9-]{10,}\b'

# fixed-email (ENV-3): a step or test that creates an account.
signupWords:
  - sign up
  - signs up
  - signing up
  - signup
  - sign-up
  - register
  - registration
  - create an account
  - create account
  - create a new account
  - join
  - onboard
  - onboarding

# fixed-wait (LRN-4)
fixedWaitPatterns:
  - '\b(?:wait|sleep|pause)(?:\s+for)?\s+(?:about\s+)?\d+(?:\.\d+)?\s*(?:ms|milliseconds?|s|secs?|seconds?|m|mins?|minutes?)\b'
  - '\bwaitForTimeout\s*\('
