# Word lists and patterns behind the lint rules. English only for now.
# Tune here, then run `pnpm --filter ./packages/spec gen:words` (a test fails if
# src/lint/words.generated.ts is out of date). Phrases match whole words,
# case-insensitively. Patterns are JavaScript regular expressions (flag i).

# vague-step: phrases that say nothing a browser can do.
vaguePhrases:
  - log in normally
  - log in as usual
  - login normally
  - sign in normally
  - do the usual
  - the usual steps
  - the usual way
  - as usual
  - as normal
  - set things up
  - set everything up
  - set it up
  - get set up
  - check it works
  - check that it works
  - check everything works
  - check everything
  - make sure it works
  - make sure everything works
  - verify it works
  - verify everything
  - test it
  - test everything
  - do the thing
  - do stuff
  - and so on
  - etc
  - somehow
  - whatever is needed
  - if needed

