# Run: maestro test tests__sign-out.maestro.yaml -e SHOP_PASSWORD=…
# Secrets are read from Maestro env vars (SHOP_PASSWORD); no value is in this file.
# The app must be installed first (adb install <apk>).
appId: com.acme.shop
name: "Signing out asks first"
tags:
  - "auth"
env:
  TESTAMENT_BASE_URL: "http://127.0.0.1:4180"
---
# setup: POST /__test/seed
- evalScript: "${output.setup1 = http.post(TESTAMENT_BASE_URL + \"/__test/seed\", { body: \"\" }).status}"
- assertTrue: "${output.setup1 >= 200 && output.setup1 < 300}"

- launchApp:
    clearState: true
    permissions:
      all: unset

# 1. Use: flows/sign-in.test.md

# 1. Type {{params.email}} into "Email"
- tapOn:
    id: "com.acme.shop:id/sign_in_email"
- eraseText
- inputText: "ada@example.com"

# 2. Type {{params.password}} into "Password"
- tapOn:
    id: "com.acme.shop:id/sign_in_password"
- eraseText
- inputText: "${SHOP_PASSWORD}"

# 3. Tap "Sign in"
- tapOn:
    id: "com.acme.shop:id/sign_in_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/sign_in_button"
    timeout: 10000

# 4. Expect: the screen heading is "Projects"
- assertVisible:
    text: "Projects"

# 2. Tap "Sign out"
- tapOn:
    id: "com.acme.shop:id/sign_out_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/sign_out_button"
    timeout: 10000

# 3. Expect: a dialog asks "Sign out of Acme Shop?"
- assertVisible:
    text: "Sign out of Acme Shop\\?"

# 4. Tap "Sign out" in the dialog
- tapOn:
    text: "SIGN OUT"

# 5. Expect: the screen heading is "Sign in to Acme Shop"
- assertVisible:
    text: "Sign in to Acme Shop"
