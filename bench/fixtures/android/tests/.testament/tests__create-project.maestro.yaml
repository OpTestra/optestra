# Run: maestro test tests__create-project.maestro.yaml -e SHOP_PASSWORD=…
# Secrets are read from Maestro env vars (SHOP_PASSWORD); no value is in this file.
# The app must be installed first (adb install <apk>).
appId: com.acme.shop
name: "A new project is saved"
tags:
  - "smoke"
  - "projects"
env:
  TESTAMENT_BASE_URL: "http://127.0.0.1:4180"
---
# setup: POST /__test/seed
- evalScript: "${output.setup1 = http.post(TESTAMENT_BASE_URL + \"/__test/seed\", { headers: {\"Content-Type\":\"application/json\"}, body: JSON.stringify({\"projects\":[\"Website redesign\"]}) }).status}"
- assertTrue: "${output.setup1 >= 200 && output.setup1 < 300}"

- launchApp:
    clearState: true
    permissions:
      all: unset

# 1. Use: flows/sign-in.test.md

# 1. Type {{params.email}} into "Email"
- tapOn:
    id: "com.acme.shop:id/sign_in_email"
- eraseText
- inputText: "ada@example.com"

# 2. Type {{params.password}} into "Password"
- tapOn:
    id: "com.acme.shop:id/sign_in_password"
- eraseText
- inputText: "${SHOP_PASSWORD}"

# 3. Tap "Sign in"
- tapOn:
    id: "com.acme.shop:id/sign_in_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/sign_in_button"
    timeout: 10000

# 4. Expect: the screen heading is "Projects"
- assertVisible:
    text: "Projects"

# 2. Tap "New project"
- tapOn:
    id: "com.acme.shop:id/new_project_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/new_project_button"
    timeout: 10000

# 3. Type Q3 roadmap into "Project name"
- tapOn:
    id: "com.acme.shop:id/project_name"
- eraseText
- inputText: "Q3 roadmap"

# 4. Tap "Create project"
- tapOn:
    id: "com.acme.shop:id/create_project_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/create_project_button"
    timeout: 10000

# 5. Expect: a message says "Project created"
# Checked by Testament only: the message is a toast, and Maestro can't see toasts.

# 6. Expect: the list shows "Q3 roadmap"
- assertVisible:
    text: ".*Q3 roadmap.*"

# 7. Tap "Refresh"
- tapOn:
    id: "com.acme.shop:id/refresh_button"

# 8. Expect: the list shows "Q3 roadmap"
- assertVisible:
    text: ".*Q3 roadmap.*"
