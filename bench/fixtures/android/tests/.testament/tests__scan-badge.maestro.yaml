# Run: maestro test tests__scan-badge.maestro.yaml -e SHOP_PASSWORD=…
# Secrets are read from Maestro env vars (SHOP_PASSWORD); no value is in this file.
# The app must be installed first (adb install <apk>).
appId: com.acme.shop
name: "Scanning a badge asks for the camera"
tags:
  - "permissions"
env:
  TESTAMENT_BASE_URL: "http://127.0.0.1:4180"
---
# setup: POST /__test/seed
- evalScript: "${output.setup1 = http.post(TESTAMENT_BASE_URL + \"/__test/seed\", { headers: {\"Content-Type\":\"application/json\"}, body: JSON.stringify({\"projects\":[\"Website redesign\"]}) }).status}"
- assertTrue: "${output.setup1 >= 200 && output.setup1 < 300}"

- launchApp:
    clearState: true
    permissions:
      all: unset

# 1. Use: flows/sign-in.test.md

# 1. Type {{params.email}} into "Email"
- tapOn:
    id: "com.acme.shop:id/sign_in_email"
- eraseText
- inputText: "ada@example.com"

# 2. Type {{params.password}} into "Password"
- tapOn:
    id: "com.acme.shop:id/sign_in_password"
- eraseText
- inputText: "${SHOP_PASSWORD}"

# 3. Tap "Sign in"
- tapOn:
    id: "com.acme.shop:id/sign_in_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/sign_in_button"
    timeout: 10000

# 4. Expect: the screen heading is "Projects"
- assertVisible:
    text: "Projects"

# 2. Tap "Website redesign"
- tapOn:
    text: "Website redesign"

# 3. Expect: the screen heading is "Website redesign"
- assertVisible:
    text: "Website redesign"

# 4. Tap "Scan badge"
- tapOn:
    id: "com.acme.shop:id/scan_badge_button"
- extendedWaitUntil:
    notVisible:
      id: "com.acme.shop:id/scan_badge_button"
    timeout: 10000

# 5. Allow camera access when Android asks
- tapOn:
    id: ".*:id/(permission_allow_foreground_only_button|permission_allow_button|permission_allow_always_button)"

# 6. Expect: the screen says "Camera access allowed"
- assertVisible:
    text: ".*Camera access allowed.*"
