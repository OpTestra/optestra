appId: com.acme.shop
name: "A wrong password is refused"
tags:
  - "auth"
env:
  OPTESTRA_BASE_URL: "http://127.0.0.1:4180"
---
# setup: POST /__test/seed
- evalScript: "${output.setup1 = http.post(OPTESTRA_BASE_URL + \"/__test/seed\", { body: \"\" }).status}"
- assertTrue: "${output.setup1 >= 200 && output.setup1 < 300}"

- launchApp:
    clearState: true
    permissions:
      all: unset

# 1. Type ada@example.com into "Email"
- tapOn:
    id: "com.acme.shop:id/sign_in_email"
- eraseText
- inputText: "ada@example.com"

# 2. Type not-the-password into "Password"
- tapOn:
    id: "com.acme.shop:id/sign_in_password"
- tapOn:
    id: "com.acme.shop:id/sign_in_password"
- eraseText
- inputText: "not-the-password"

# 3. Tap "Sign in"
- tapOn:
    id: "com.acme.shop:id/sign_in_button"

# 4. Expect: a message says "Email or password is incorrect."
- assertVisible:
    text: ".*Email or password is incorrect\\..*"

# 5. Expect: the screen heading is "Sign in to Acme Shop"
- assertVisible:
    text: "Sign in to Acme Shop"
