# Acme Shop for Android as a project: the Bench fixture app (BEN-1).
# Build the APKs (pnpm --filter @testament/fixture-android build:apks), then start
# the shop's server on the port the app is built for:
#   pnpm --filter @testament/fixture-shop start -- --port 4180
version: 1

project:
  name: Acme Shop for Android
  target: android

defaultEnvironment: local

environments:
  local:
    app: app/build/outputs/apk/correct/debug/acme-shop-android-correct-debug.apk
    # Setup hooks (seed, reset) go to the shop's server from this machine.
    baseUrl: http://127.0.0.1:4180
    # The emulator's host alias for this machine, on the shop's port only.
    allowedDomains: [10.0.2.2:4180]

secrets:
  SHOP_PASSWORD:
    # On Android a secret's domains name the app packages it may be typed into.
    domains: [com.acme.shop]
    description: Password of the seeded user ada@example.com

# Tests run on Android 16, on a Pixel 8 profile (the defaults; --android and
# --device override them).
android:
  version: "16"
  device: pixel-8
